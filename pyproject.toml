[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostenv"
version = "0.1.0"
description = "Local .env doctor: compares env var names used in code, defined in .env, and documented in .env.example - names only, values never read into output"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["dotenv", "environment", "ghostslice", "agents", "configuration"]
dependencies = []

[project.scripts]
ghostenv = "ghostenv.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
